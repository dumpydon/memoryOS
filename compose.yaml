services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: memoryos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryos
      POSTGRES_PASSWORD: memoryos
      POSTGRES_DB: memoryos
    ports:
      - "5432:5432"
    volumes:
      - memoryos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryos -d memoryos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memoryos-postgres-data:

